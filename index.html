<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Awesome Dot：OpenAI dots 官方案例、社区项目和开发资源导航。每条收录都有来源与 Dot 的具体角色。" />
    <meta name="theme-color" content="#e8462a" />
    <script>try{var m=localStorage.getItem('awesome-dot-theme');document.documentElement.dataset.theme=m==='light'||m==='dark'?m:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){document.documentElement.dataset.theme='dark'}</script>
    <title>Awesome Dot - 案例与项目导航</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

</html>
