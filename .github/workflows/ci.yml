name: Validate Directory

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # generate 会读取头像等文件，登记和文件不一致时在这里就能发现，不用等到发布失败
      - run: npm run generate
      - run: npm run build
